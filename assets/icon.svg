<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5b8a72"/>
      <stop offset="100%" stop-color="#6b8cae"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Grid lines suggesting matrix / linear algebra -->
    <rect x="140" y="140" width="232" height="232" rx="16" stroke-width="16" opacity="0.9"/>
    <line x1="140" y1="256" x2="372" y2="256" stroke-width="12" opacity="0.7"/>
    <line x1="256" y1="140" x2="256" y2="372" stroke-width="12" opacity="0.7"/>
    <!-- Vector arrow -->
    <line x1="180" y1="332" x2="300" y2="180" stroke-width="14" opacity="0.85"/>
    <polyline points="270,180 300,180 300,210" stroke-width="14" opacity="0.85"/>
  </g>
</svg>
